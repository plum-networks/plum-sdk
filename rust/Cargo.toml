[package]
name = "plumbox-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Connect a third-party app to the user's Plum Box: delegated OAuth (PKCE) with refresh, and the box's Drive"
repository = "https://github.com/plum-networks/plum-sdk"
homepage = "https://developer.plum.im"
documentation = "https://github.com/plum-networks/plum-sdk/tree/main/rust"
readme = "README.md"
keywords = ["plum", "plumbox", "oauth", "pkce", "storage"]
categories = ["api-bindings", "authentication", "filesystem"]
# Not on crates.io yet: depend on it from git (see README.md).
publish = false

[features]
default = ["webpki-roots"]
# The HTTP client the SDK builds when the app passes none: rustls with ring
# and Mozilla's root certificates (webpki-roots). Turn it off to bring your
# own `reqwest::Client` (`PlumClientBuilder::http_client`, the `http`
# parameter of the OAuth functions).
webpki-roots = ["dep:rustls", "dep:webpki-roots"]
# An in-process fake Plum Box for tests (`plumbox_client::testing`), and the
# loopback `Environment::Local` it signs in with. TESTS ONLY: never enable it
# in a product build. `Environment::Local` accepts an `http://127.0.0.1` box,
# which a product build must not be able to do even behind a switch, so it
# exists only when this feature is compiled in.
testing = ["dep:axum", "tokio/net", "tokio/rt"]

[dependencies]
base64 = "0.23"
bytes = "1"
getrandom = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1.40", default-features = false, features = ["sync", "fs", "io-util"] }
url = "2.5"

rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = { version = "1", optional = true }

axum = { version = "0.8", optional = true, default-features = false, features = ["tokio", "http1"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "time"] }

[[test]]
name = "oauth"
required-features = ["testing"]

[[test]]
name = "refresh"
required-features = ["testing"]

[[test]]
name = "drive"
required-features = ["testing"]

[package.metadata.docs.rs]
all-features = true
